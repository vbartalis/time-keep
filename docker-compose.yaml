# Deployment on Coolify (Docker Compose build pack). Coolify builds the image from the
# Dockerfile, keeps the named volume across redeploys, and asks for the two variables
# marked required. Set the service's domain in Coolify as https://<domain>:3000.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # Read only on the first start, while no admin exists.
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set the first admin's username}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set the first admin's password}
      # Fixed here so no deployment setting can point the database off the volume.
      DATABASE_PATH: /data/time-keep.db
    volumes:
      - time-keep-data:/data
    expose:
      - '3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  time-keep-data:
