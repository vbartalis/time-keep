# Deployment on Coolify (Docker Compose build pack, decision 10). Nothing to fill in:
# SERVICE_URL_APP_3000 makes Coolify generate the domain and route its proxy to port
# 3000, SERVICE_PASSWORD_ADMIN makes it generate the first admin's password (shown in
# the resource's environment variables), and the named volume is kept across redeploys.
services:
  app:
    build: .
    volumes:
      - 'time-keep-data:/data'
    environment:
      - SERVICE_URL_APP_3000
      - 'ADMIN_USERNAME=${ADMIN_USERNAME:-admin}'
      - 'ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}'
      # Fixed here so no deployment setting can point the database off the volume.
      - DATABASE_PATH=/data/time-keep.db
      # Visitors arrive over https through a Cloudflare tunnel, while Coolify's proxy
      # sees and forwards plain http. Empty, adapter-node takes the scheme as https, so
      # the origin check matches the browser's; the host still comes from the proxy.
      - PROTOCOL_HEADER=
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

volumes:
  time-keep-data:
