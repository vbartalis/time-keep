services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      target: base
    # Come back after a host reboot / daemon restart. Pairs with
    # "shutdownAction": "none" in devcontainer.json.
    restart: unless-stopped
    # tini as PID 1, so orphaned children are reaped. `sleep infinity` never
    # waits on anything; without this, every git/node/bash process whose parent
    # exited first stays a zombie for the life of the container.
    init: true
    volumes:
      # The parent of the repo, at /workspaces itself. "Clone Repository in
      # Container Volume" mounts its volume at /workspaces and replaces this
      # entry; a deeper target would be mounted over the clone and hide it.
      - ../..:/workspaces:cached
      # Persist Claude Code state (plugins, credentials) across image rebuilds.
      - claude-home:/home/vscode/.claude
    command: sleep infinity

volumes:
  claude-home:
